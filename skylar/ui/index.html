<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skylar · Blackwall</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="star">✦</span>
        <span class="name">Blackwall</span>
        <span class="sub">Skylar's brain</span>
      </div>
      <div class="legend">
        <span class="dot core"></span> memory
        <span class="dot note"></span> notes
        <span class="dot journal"></span> journal
        <span class="dot reflection"></span> reflections
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <main id="stage">
      <canvas id="graph"></canvas>
      <div id="empty" class="empty hidden">
        <p>Skylar's brain is empty right now.</p>
        <p class="muted">Chat with her or journal, then refresh — the stars will appear here.</p>
      </div>
    </main>

    <aside id="panel" class="panel hidden">
      <button id="panel-close" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
